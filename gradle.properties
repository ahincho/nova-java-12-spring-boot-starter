# NOVA-SEMVER-23: Habilitar Gradle Local Build Cache
org.gradle.caching=true

# Configuration Cache apagada: con ella, dependencyCheckAnalyze falla antes de analizar nada
# (el plugin de OWASP lee Task.project al ejecutarse y Gradle 9.2 no puede guardar la caché),
# y marcar la tarea con notCompatibleWithConfigurationCache no lo evita. Es lo mismo que hace
# nova-java-09-observability-spring-boot-starter.
org.gradle.configuration-cache=false